<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#e4e0d6;} a{color:#1d1c1a;} a:hover{color:#dc6a48;} input[type=range]{accent-color:#1d1c1a;height:12px;margin:0;width:100%;min-width:0;} button{font-family:'IBM Plex Mono',monospace;}</style>
</helmet>
<div ref="{{ wrapRef }}" style="width:100%;padding:24px 0;box-sizing:border-box;overflow:hidden;font-family:'IBM Plex Mono',monospace;color:#1d1c1a;display:flex;justify-content:center;align-items:flex-start">
<div ref="{{ stageRef }}" style="width:900px;box-sizing:border-box;flex:none;transform-origin:top center;background:#fbfaf6;border:1px solid #1d1c1a;box-shadow:0 18px 50px rgba(40,35,25,0.18)">

<div style="display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid #1d1c1a;background:#fbfaf6">
  <span style="font-family:'IBM Plex Sans Condensed',sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.01em">miditin 1</span>
  <span style="font-size:9px;color:#8d887e;letter-spacing:0.05em">ENERGY → PULSE → GENERATE → TRANSFORM → MIDI</span>
  <div style="flex:1"></div>
  <button onClick="{{ togglePlay }}" style="font-size:10px;padding:5px 9px;border:1px solid #1d1c1a;background:{{ playBg }};color:{{ playFg }};cursor:pointer">{{ playTxt }}</button>
  <label style="display:flex;align-items:center;gap:6px;font-size:10px;color:#8d887e">BPM<input type="range" min="60" max="200" step="1" value="{{ bpm }}" onChange="{{ setBpm }}" style="width:70px"><span style="color:#1d1c1a;width:22px">{{ bpm }}</span></label>
  <button onClick="{{ toggleVoice }}" style="font-size:10px;padding:5px 9px;border:1px solid #1d1c1a;background:#fbfaf6;color:#1d1c1a;cursor:pointer;width:52px">{{ voiceTxt }}</button>
  <button onClick="{{ toggleSynth }}" style="font-size:10px;padding:5px 9px;border:1px solid #1d1c1a;background:{{ synthBg }};color:{{ synthFg }};cursor:pointer">SOUND {{ synthTxt }}</button>
  <button onClick="{{ toggleMidi }}" style="font-size:10px;padding:5px 9px;border:1px solid #1d1c1a;background:{{ midiBg }};color:{{ midiFg }};cursor:pointer">MIDI {{ midiTxt }}</button>
</div>

<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative;padding-bottom:6px"><canvas ref="{{ ovRef }}" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0"></canvas><canvas ref="{{ ov2Ref }}" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2"></canvas>

  <div style="display:flex;flex-direction:column;position:relative;z-index:1">
    <div style="display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 10px 0"><span style="font-size:10px;font-weight:600;letter-spacing:0.18em">ENERGY</span><span style="font-size:9px;color:#8d887e">lfo</span></div>
    <canvas ref="{{ lfoRef }}" onPointerDown="{{ lfoDown }}" onPointerMove="{{ lfoMove }}" onPointerUp="{{ lfoUp }}" style="width:204px;height:120px;display:block;margin:10px 10px 0;cursor:{{ lfoCursor }};touch-action:none"></canvas>
    <div style="padding:10px;display:flex;flex-direction:column;gap:6px;flex:1">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:#e8e3d8;border-radius:999px;padding:2px">
        <sc-for list="{{ lsrcOpts }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.on }}" style="font-size:9px;padding:4px 0;border:none;border-radius:999px;transition:background 0.12s;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;text-transform:uppercase">{{ o.label }}</button></sc-for>
      </div>
      <sc-if value="{{ isOsc }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:#e8e3d8;border-radius:999px;padding:2px">
        <sc-for list="{{ shapeOpts }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.on }}" style="font-size:9px;padding:3px 0;border:none;border-radius:999px;transition:background 0.12s;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;text-transform:uppercase">{{ o.label }}</button></sc-for>
      </div>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:6px">
        <button onClick="{{ toggleSync }}" style="font-size:9px;padding:3px 0;border:1px solid #1d1c1a;background:{{ syncBg }};color:{{ syncFg }};cursor:pointer">SYNC {{ syncTxt }}</button>
        <button onClick="{{ toggleRetrig }}" style="font-size:9px;padding:3px 0;border:1px solid #1d1c1a;background:{{ retrigBg }};color:{{ retrigFg }};cursor:pointer">RETRIG {{ retrigTxt }}</button>
      </div>
      </sc-if>
      <sc-if value="{{ isVel }}" hint-placeholder-val="{{ false }}">
      </sc-if>
      <sc-if value="{{ isCC }}" hint-placeholder-val="{{ false }}">
        <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">CC #</span><input type="range" min="0" max="119" step="1" value="{{ ccNum }}" onChange="{{ setCC }}"><span style="text-align:right">{{ ccNum }}</span></label>
        <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">IN VAL</span><input type="range" min="0" max="127" step="1" value="{{ ccVal }}" onChange="{{ setCCVal }}"><span style="text-align:right">{{ ccVal }}</span></label>
      </sc-if>
      <div style="display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">FILTER</span>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#e8e3d8;border-radius:999px;padding:2px">
        <sc-for list="{{ filtOpts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.on }}" style="font-size:9px;padding:3px 0;border:none;border-radius:999px;transition:background 0.12s;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;text-transform:uppercase">{{ o.label }}</button></sc-for>
        </div>
      </div>
      <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">{{ amtLabel }}</span><input type="range" min="0" max="1" step="0.01" value="{{ lAmt }}" onChange="{{ setLAmt }}"><span style="text-align:right">{{ lAmtTxt }}</span></label>
    </div>
  </div>


  <div style="display:flex;flex-direction:column;position:relative;z-index:1">
    <div style="display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 10px 0"><span style="font-size:10px;font-weight:600;letter-spacing:0.18em">PULSE</span><span style="font-size:9px;color:#8d887e">{{ source }}</span></div>
    <canvas ref="{{ pulseRef }}" style="width:204px;height:120px;display:block;margin:10px 10px 0"></canvas>
    <div style="padding:10px;display:flex;flex-direction:column;gap:6px;flex:1">
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:0;background:#e8e3d8;border-radius:999px;padding:2px">
        <sc-for list="{{ srcOpts }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.on }}" style="font-size:9px;padding:4px 0;border:none;border-radius:999px;transition:background 0.12s;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;text-transform:uppercase;letter-spacing:0.04em">{{ o.label }}</button></sc-for>
      </div>
      <sc-if value="{{ isWheel }}" hint-placeholder-val="{{ true }}">
        <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">SLICES</span><input type="range" min="3" max="24" step="1" value="{{ slices }}" onChange="{{ setSlices }}"><span style="text-align:right">{{ slices }}</span></label>
        <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">SPEED</span><input type="range" min="0.05" max="2" step="0.01" value="{{ maxSpeed }}" onChange="{{ setMaxSpeed }}"><span style="text-align:right">{{ maxSpeedTxt }}</span></label>
        <button onClick="{{ kick }}" style="font-size:9px;padding:5px 0;border:1px solid #1d1c1a;background:#fbfaf6;cursor:pointer;letter-spacing:0.06em">SPIN ↻</button>
      </sc-if>
      <sc-if value="{{ isShaker }}" hint-placeholder-val="{{ false }}">
        <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">AGITATE</span><input type="range" min="0" max="1" step="0.01" value="{{ agit }}" onChange="{{ setAgit }}"><span style="text-align:right">{{ agitTxt }}</span></label>
        <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">BALLS</span><input type="range" min="1" max="12" step="1" value="{{ balls }}" onChange="{{ setBalls }}"><span style="text-align:right">{{ balls }}</span></label>
        <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">BOUNCE</span><input type="range" min="0.3" max="0.98" step="0.01" value="{{ restitution }}" onChange="{{ setRestitution }}"><span style="text-align:right">{{ restitutionTxt }}</span></label>
        <button onClick="{{ kick }}" style="font-size:9px;padding:5px 0;border:1px solid #1d1c1a;background:#fbfaf6;cursor:pointer;letter-spacing:0.06em">SHAKE ⇄</button>
      </sc-if>
      <sc-if value="{{ isDigital }}" hint-placeholder-val="{{ false }}">
        <div style="display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">BASE</span>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:#e8e3d8;border-radius:999px;padding:2px">
        <sc-for list="{{ baseOpts }}" as="o" hint-placeholder-count="4"><button onClick="{{ o.on }}" style="font-size:9px;padding:3px 0;border:none;border-radius:999px;transition:background 0.12s;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer">{{ o.label }}</button></sc-for>
          </div>
        </div>
        <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">DIV</span><input type="range" min="0" max="4" step="1" value="{{ digDiv }}" onChange="{{ setDigDiv }}"><span style="text-align:right">{{ digDivTxt }}</span></label>
        <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">SWING</span><input type="range" min="0" max="0.6" step="0.01" value="{{ swing }}" onChange="{{ setSwing }}"><span style="text-align:right">{{ swingTxt }}</span></label>
      </sc-if>
      <sc-if value="{{ notNone }}" hint-placeholder-val="{{ true }}">
        <div style="padding-top:4px;display:flex;flex-direction:column;gap:6px">
          <div style="display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">ENERGY</span>
            <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:0;background:#e8e3d8;border-radius:999px;padding:2px">
        <sc-for list="{{ modOpts }}" as="o" hint-placeholder-count="2"><button onClick="{{ o.on }}" style="font-size:9px;padding:3px 0;border:none;border-radius:999px;transition:background 0.12s;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;text-transform:uppercase">{{ o.label }}</button></sc-for>
            </div>
          </div>
          <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">OFFSET</span><input type="range" min="-1" max="1" step="0.01" value="{{ modOff }}" onChange="{{ setModOff }}"><span style="text-align:right">{{ modOffTxt }}</span></label>
          <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">SCALE</span><input type="range" min="-2" max="2" step="0.01" value="{{ modScl }}" onChange="{{ setModScl }}"><span style="text-align:right">{{ modSclTxt }}</span></label>
        </div>
      </sc-if>
      <sc-if value="{{ isNone }}" hint-placeholder-val="{{ false }}">
      </sc-if>
    </div>
  </div>


  <div style="display:flex;flex-direction:column;position:relative;z-index:1">
    <div style="display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 10px 0"><span style="font-size:10px;font-weight:600;letter-spacing:0.18em">GENERATE</span><span style="font-size:9px;color:#8d887e">{{ gen }}</span></div>
    <canvas ref="{{ genRef }}" onPointerDown="{{ genDown }}" onPointerMove="{{ genMove }}" style="width:204px;height:120px;display:block;margin:10px 10px 0;cursor:{{ genCursor }};touch-action:none"></canvas>
    <div style="padding:10px;display:flex;flex-direction:column;gap:6px;flex:1">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#e8e3d8;border-radius:999px;padding:2px">
        <sc-for list="{{ genOpts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.on }}" style="font-size:9px;padding:4px 0;border:none;border-radius:999px;transition:background 0.12s;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;text-transform:uppercase;letter-spacing:0.04em">{{ o.label }}</button></sc-for>
      </div>
      <sc-if value="{{ isArp }}" hint-placeholder-val="{{ true }}">
        <sc-if value="{{ isTones }}" hint-placeholder-val="{{ true }}"><label style="display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">TONES</span><input value="{{ arpText }}" onChange="{{ setArpText }}" style="font:inherit;font-size:11px;border:1px solid #1d1c1a;background:#ffffff;padding:3px 6px;width:100%;box-sizing:border-box;outline:none;min-width:0"></label></sc-if>
        <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:#e8e3d8;border-radius:999px;padding:2px">
        <sc-for list="{{ orderOpts }}" as="o" hint-placeholder-count="5"><button onClick="{{ o.on }}" style="font-size:8px;padding:4px 0;border:none;border-radius:999px;transition:background 0.12s;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;text-transform:uppercase">{{ o.label }}</button></sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ isMel }}" hint-placeholder-val="{{ false }}">
        <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">LENGTH</span><input type="range" min="2" max="16" step="1" value="{{ melLen }}" onChange="{{ setMelLen }}"><span style="text-align:right">{{ melLen }}</span></label>
        <div style="display:flex;gap:6px;align-items:center;font-size:9px;color:#8d887e"><span style="flex:1"></span><button onClick="{{ toggleMelTr }}" style="font-size:9px;padding:3px 6px;border:1px solid #1d1c1a;background:{{ melTrBg }};color:{{ melTrFg }};cursor:pointer">TRANSPOSE BY IN</button><button onClick="{{ clearMel }}" style="font-size:9px;padding:3px 6px;border:1px solid #1d1c1a;background:#fbfaf6;cursor:pointer">CLEAR</button></div>
      </sc-if>
      <div style="display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">RUN</span>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:0;background:#e8e3d8;border-radius:999px;padding:2px">
        <sc-for list="{{ modeOpts }}" as="o" hint-placeholder-count="2"><button onClick="{{ o.on }}" style="font-size:8px;padding:4px 0;border:none;border-radius:999px;transition:background 0.12s;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;text-transform:uppercase">{{ o.label }}</button></sc-for>
        </div>
      </div>
    </div>
  </div>


  <div style="display:flex;flex-direction:column;position:relative;z-index:1">
    <div style="display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 10px 0"><span style="font-size:10px;font-weight:600;letter-spacing:0.18em">TRANSFORM</span><span style="font-size:9px;color:#8d887e">{{ tmode }}</span></div>
    <canvas ref="{{ transRef }}" onPointerDown="{{ transDown }}" style="width:204px;height:120px;display:block;margin:10px 10px 0;cursor:{{ transCursor }}"></canvas>
    <div style="padding:10px;display:flex;flex-direction:column;gap:6px;flex:1">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#e8e3d8;border-radius:999px;padding:2px">
        <sc-for list="{{ tOpts }}" as="o" hint-placeholder-count="3"><button onClick="{{ o.on }}" style="font-size:9px;padding:4px 0;border:none;border-radius:999px;transition:background 0.12s;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer;text-transform:uppercase">{{ o.label }}</button></sc-for>
      </div>
      <sc-if value="{{ isSetMode }}" hint-placeholder-val="{{ false }}">
        <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">OCT LEN</span><input type="range" min="1" max="24" step="1" value="{{ period }}" onChange="{{ setPeriod }}"><span style="text-align:right">{{ period }}st</span></label>
      </sc-if>
      <button onClick="{{ toggleWrap }}" style="font-size:9px;padding:3px 0;border:1px solid #1d1c1a;background:{{ wrapBg }};color:{{ wrapFg }};cursor:pointer">OCTAVE WRAP {{ wrapTxt }}</button>
      <sc-if value="{{ isScale }}" hint-placeholder-val="{{ true }}">
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:2px 0;background:#e8e3d8;border-radius:9px;padding:2px">
        <sc-for list="{{ scaleOpts }}" as="o" hint-placeholder-count="8"><button onClick="{{ o.on }}" style="font-size:8px;padding:3px 0;border:none;border-radius:999px;transition:background 0.12s;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer">{{ o.label }}</button></sc-for>
        </div>
      </sc-if>
      <sc-if value="{{ showPcs }}" hint-placeholder-val="{{ true }}">
        <label style="display:grid;grid-template-columns:42px minmax(0,1fr) 36px;align-items:center;gap:6px;font-size:9px"><span style="color:#8d887e">OCTAVE</span><input type="range" min="1" max="7" step="{{ octStep }}" value="{{ octave }}" onChange="{{ setOctave }}"><span style="text-align:right">{{ octTxt }}</span></label>
      </sc-if>
      <sc-if value="{{ isHeld }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:9px;color:#8d887e">{{ heldTxt }}</div>
      </sc-if>
    </div>
  </div>
</div>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr))">
  <div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 10px 0"><span style="font-size:10px;font-weight:600;letter-spacing:0.18em">IN</span><span style="font-size:9px;color:#8d887e">→ {{ inFeeds }}</span></div>
    <canvas ref="{{ inRef }}" onPointerDown="{{ inDown }}" style="width:429px;height:44px;display:block;margin:10px 10px 0;cursor:pointer"></canvas>
    <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:9px">
      <span style="color:#8d887e">HELD</span><span style="flex:1">{{ heldTxt }}</span>
      <button onClick="{{ clearHeld }}" style="font-size:9px;padding:3px 6px;border:1px solid #1d1c1a;background:#fbfaf6;cursor:pointer">RELEASE ALL</button>
    </div>
  </div>
  <div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:1px;padding:12px 10px 0"><span style="font-size:10px;font-weight:600;letter-spacing:0.18em">OUT</span><span style="font-size:9px;color:#8d887e">{{ outName }}</span></div>
    <canvas ref="{{ outRef }}" style="width:429px;height:44px;display:block;margin:10px 10px 0"></canvas>
    <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:9px">
      <label style="display:flex;align-items:center;gap:6px"><span style="color:#8d887e">GATE</span><input type="range" min="30" max="1200" step="10" value="{{ gate }}" onChange="{{ setGate }}" style="width:70px"><span style="width:40px">{{ gate }}ms</span></label>
      <div style="flex:1;display:flex;gap:3px;justify-content:flex-end;overflow:hidden">
        <sc-for list="{{ log }}" as="l" hint-placeholder-count="0"><div style="display:flex;gap:3px;align-items:baseline;border:1px solid #cfc9bd;padding:1px 4px;opacity:{{ l.op }};flex:none"><span style="color:#8d887e;font-size:8px">{{ l.d }}</span><span>{{ l.n }}</span></div></sc-for>
      </div>
    </div>
    <sc-if value="{{ showOuts }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-wrap:wrap;gap:4px;padding:0 10px 8px">
        <sc-for list="{{ outOpts }}" as="o" hint-placeholder-count="1"><button onClick="{{ o.on }}" style="font-size:9px;padding:3px 6px;border:1px solid #1d1c1a;background:{{ o.bg }};color:{{ o.fg }};cursor:pointer">{{ o.label }}</button></sc-for>
      </div>
    </sc-if>
  </div>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;minPulseGap&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:30,&quot;min&quot;:0,&quot;max&quot;:200,&quot;step&quot;:5,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
