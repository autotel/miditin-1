name: Build

# The release build for Linux, macOS and Windows: VST3 + Standalone + the printed manual, zipped.
# Local builds (build.sh) do not print the manual; ./print-manual.sh does that on demand.
#
# Versions are commit hashes (the window shows the build's sha), so every push to main builds and
# its bundle is named by that sha. Every push to main also publishes a GitHub Release, tagged
# build-<sha>; a version tag publishes one under that tag's name.
on:
  push:
    branches: [ main ]
    tags: [ 'v*', '[0-9]+.[0-9]+.[0-9]+' ]
  workflow_dispatch:

jobs:
  # The printed manual is the same on every platform, so it is made once (pandoc + the runner's
  # Chrome, see print-manual.sh) and each platform's job stages it into its bundle.
  manual:
    name: Manual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Print manual
        run: plugin/print-manual.sh "$PWD/manual/miditin 1 manual.pdf"

      - name: Upload manual
        uses: actions/upload-artifact@v6
        with:
          name: manual
          path: manual

  build:
    name: ${{ matrix.name }}
    needs: manual
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux }
          - { os: macos-latest,  name: macOS }
          - { os: windows-2022,  name: Windows }
    defaults:
      run:
        shell: bash
    steps:
      # CMakeLists.txt finds JUCE and the librarian as siblings (../JUCE, ../autotel-plugin-presets-
      # librarian), so all three are checked out side by side.
      - name: Checkout plugin
        uses: actions/checkout@v5
        with:
          path: plugin

      - name: Short sha
        id: sha
        run: echo "short=$(git -C plugin rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout JUCE 8.0.12
        uses: actions/checkout@v5
        with:
          repository: juce-framework/JUCE
          ref: 8.0.12
          path: JUCE

      - name: Checkout presets librarian
        uses: actions/checkout@v5
        with:
          repository: autotel/autotel-plugin-presets-librarian
          path: autotel-plugin-presets-librarian

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libx11-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      # macOS ships universal (Apple silicon + Intel) so one bundle loads in either kind of host.
      - name: Configure
        run: >
          cmake -S plugin -B plugin/build -DCMAKE_BUILD_TYPE=Release
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: >
          cmake --build plugin/build --config Release --parallel
          --target Miditin_VST3 Miditin_Standalone MiditinTests MiditinHostCheck

      - name: Test suite
        run: plugin/build/MiditinTests_artefacts/Release/MiditinTests

      # Not run on macOS/Windows as a gate yet: nobody has watched JUCE's VST3 hosting load the
      # plugin headlessly there. Its result shows in the log; make it blocking once it is green.
      - name: VST3 host check
        continue-on-error: ${{ runner.os != 'Linux' }}
        run: >
          plugin/build/MiditinHostCheck_artefacts/Release/MiditinHostCheck
          "plugin/build/Miditin_artefacts/Release/VST3/miditin 1.vst3"

      - name: Download manual
        uses: actions/download-artifact@v7
        with:
          name: manual
          path: dist/miditin-1

      # Stage under a named folder and upload its parent: pointing upload-artifact at the .vst3
      # bundle itself zips its contents, a bare Contents/ with no name on it.
      # The OFL text goes along because the binaries embed the IBM Plex fonts (CLAUDE.md).
      - name: Stage release bundle
        run: |
          art=plugin/build/Miditin_artefacts/Release
          cp -R "$art/VST3/miditin 1.vst3" dist/miditin-1/
          case "$RUNNER_OS" in
            Linux)   cp "$art/Standalone/miditin 1" dist/miditin-1/ ;;
            macOS)   cp -R "$art/Standalone/miditin 1.app" dist/miditin-1/ ;;
            Windows) cp "$art/Standalone/miditin 1.exe" dist/miditin-1/ ;;
          esac
          cp plugin/Resources/Fonts/OFL-IBMPlex.txt dist/miditin-1/

      - name: Upload release bundle
        uses: actions/upload-artifact@v6
        with:
          name: miditin-1-${{ matrix.name }}-${{ steps.sha.outputs.short }}
          path: dist

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v7
        with:
          pattern: miditin-1-*
          path: artifacts

      - name: Zip each bundle
        run: |
          cd artifacts
          for d in miditin-1-*; do
            ( cd "$d" && zip -rq "../${d}.zip" miditin-1 )
          done

      # A version tag names its own release; a push to main gets build-<sha>, the sha taken from the
      # bundles so the tag matches the zips and the window.
      - name: Release name
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            sha=$(ls -d artifacts/miditin-1-Linux-* | sed 's/.*-//')
            echo "name=build-$sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: miditin 1 ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*.zip
          generate_release_notes: true
